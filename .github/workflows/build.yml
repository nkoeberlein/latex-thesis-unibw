# Baut 1Main.tex und Skript.tex mit LuaLaTeX (latexmk + .latexmkrc) –
# ersetzt eine lokale TeX-Installation zum Prüfen von Änderungen.
name: Build PDF

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile with LuaLaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            1Main.tex
            Skript.tex
          latexmk_use_lualatex: true
          latexmk_shell_escape: true
          args: -file-line-error -halt-on-error -interaction=nonstopmode
          extra_system_packages: py-pygments

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: pdf
          path: |
            1Main.pdf
            Skript.pdf
